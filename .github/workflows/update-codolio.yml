name: Update Codolio README Stats

on:
  schedule:
    - cron: "17 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-codolio-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Codolio stats and update README
        env:
          CODOLIO_URL: https://api.codolio.com/user
          CODOLIO_TOKEN: ${{ secrets.CODOLIO_TOKEN }}
        run: python scripts/update_codolio.py

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "docs: refresh Codolio coding statistics"
            git push
          fi
